<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /* Configurações globais da CSS*/
            height: 100%;
        }
        body {
            background-image: linear-gradient(to bottom, #840BFC, #FD00D3, #FF4ED4, #FF6EE3, #FF61BD, #0186FA, #0044ff, #0B23DB);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente em CSS</h1>
</body>
</html>
