<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <P>Tente abrir esse site em vários dispositivos diferentes ou simplismente aumente e diminue o tamanho do seu navegador</P>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
       <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamor aprender areproduzir áudios em HTML5</p>
    <audio preload="auto" autoplay controls loop>
        <source src="midia/gay.mp3" type="audio/mpeg">
    </audio>
    
    <!--FORMA MENOS UTILIZADA-->
    <audio src="midia/gay.mp3" controls autoplay></audio> <!-- MP3 WAV OGG -->
</body>
</html>
